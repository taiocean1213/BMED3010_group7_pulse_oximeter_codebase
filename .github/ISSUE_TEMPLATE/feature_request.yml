name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature. Please describe it below.

  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: What problem does this solve, or what would it improve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any other approaches you considered?

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project does this relate to?
      options:
        - Signal Processing (Filter / FFT)
        - Biomedical Metrics (SpO2 / Heart Rate)
        - Hardware Abstraction Layer
        - Display / UI
        - Build System / CI
        - Documentation
        - New Hardware Support
        - Other

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Diagrams, references, datasheets, or related projects.
