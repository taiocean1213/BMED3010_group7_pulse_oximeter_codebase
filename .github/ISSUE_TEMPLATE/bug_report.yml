name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill in the details below.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Build with `pio run -e due`
        2. Upload to board
        3. Observe incorrect SpO2 reading
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: input
    id: board
    attributes:
      label: Board / Hardware
      description: Which microcontroller or board are you using?
      placeholder: Arduino Due

  - type: input
    id: platformio-version
    attributes:
      label: PlatformIO Version
      description: Output of `pio --version`

  - type: textarea
    id: logs
    attributes:
      label: Logs / Serial Output
      description: Paste any relevant serial output or build logs.
      render: text

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Screenshots, waveform captures, or anything else that helps.
